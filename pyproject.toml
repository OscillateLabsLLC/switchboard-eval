[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switchboard-eval"
version = "0.1.0"
description = "Evaluation harness for Switchboard, a measured replacement for OVOS intent matching"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Oscillate Labs", email = "mike@oscillatelabs.net" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "pyyaml",
    "ovos-switchboard-pipeline-plugin>=1.1.0",
]

[project.optional-dependencies]
# talking to a running OVOS stack (stock baselines, live trials, manifest dumps)
live = ["ovos-bus-client", "ovos-config"]
# the Phase 1 encoder bench
bench = ["model2vec", "sentence-transformers"]
# the decision-model experiment
decider = ["torch", "huggingface_hub"]

[tool.hatch.build.targets.wheel]
packages = ["switchboard_eval"]
